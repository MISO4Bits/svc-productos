openapi: 3.2.0

info:
  title: Productos y Configuración de Mercado
  summary: Documentos legales, plantillas de correo, entidades financieras y tarifas del mercado.
  description: |
    API **interna** de Productos y Configuración de Mercado.

    Hoy expone los **documentos legales** del registro (términos y condiciones,
    tratamiento de datos personales y consulta en centrales de riesgo). Los textos
    y su versionado viven aquí; **la aceptación del cliente no** — la registra
    CoreTransaccional a partir de lo que envía la web (tipo y versión aceptados).

    Cada documento es **inmutable**: un cambio de texto se publica como una versión
    nueva (`V1`, `V2`, …), nunca se modifica la existente. La versión vigente de un
    tipo es la más alta publicada para su mercado e idioma.

    Consumidores:
    - **BFF Web** — sirve los textos al registro (los reenvía sin transformarlos).

    No es una API pública. Se expone solo dentro de la malla del clúster.

    Errores en formato **RFC 9457 (Problem Details)**, `application/problem+json`.
  version: 0.1.0
  contact:
    name: Equipo 4Bits
  license:
    name: Uso académico MISW4501

servers:
  - url: http://svc-productos.svc-productos.svc.cluster.local
    description: Servicio interno (in-cluster)

tags:
  - name: Documentos legales
    description: Textos legales versionados por mercado e idioma.
  - name: Plantillas de correo
    description: Asunto y cuerpo de los correos que Solventa envía, por mercado e idioma.
  - name: Tarifas
    description: Tabla de tasas por edad del seguro de vida deudor hipotecario.
  - name: Entidades financieras
    description: Bancos y entidades que el cliente puede elegir como acreedoras de su crédito.

security:
  - serviceAuth: []

paths:
  /documentos-legales:
    get:
      operationId: listarDocumentosLegalesVigentes
      tags: [Documentos legales]
      summary: Documentos legales vigentes, con su contenido
      description: |
        Devuelve la versión vigente (la más alta) de cada tipo de documento del
        mercado e idioma indicados, ya con el contenido completo, en el orden en que
        el registro los presenta: `terminos`, `open-data`, `open-finance`. Una sola
        llamada deja listos los tres modales sin más viajes a la red.

        Sin `tipo` devuelve solo los tres del registro. Con `tipo` devuelve ese documento
        (por ejemplo `poliza`, las condiciones que se muestran al solicitar la póliza); si no
        hay uno publicado para el mercado e idioma, la lista va vacía.
      parameters:
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
        - name: tipo
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TipoDocumentoLegal' }
      responses:
        '200':
          description: Versión vigente de cada documento del mercado.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /documentos-legales/{tipo}/versiones/{version}:
    get:
      operationId: obtenerVersionDocumentoLegal
      tags: [Documentos legales]
      summary: Una versión exacta de un documento (inmutable)
      description: |
        Sirve para auditoría ("qué texto exacto aceptó este cliente") y para que el
        perfil muestre lo aceptado aunque ya exista una versión posterior.
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        - name: version
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Version' }
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión solicitada. Se puede cachear indefinidamente.
          headers:
            Cache-Control:
              description: Una versión publicada nunca cambia.
              schema: { type: string, example: 'public, max-age=31536000, immutable' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoLegal' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /plantillas-correo/{tipo}:
    get:
      operationId: obtenerPlantillaCorreoVigente
      tags: [Plantillas de correo]
      summary: Versión vigente de una plantilla de correo
      description: |
        **Interno**: lo consume CoreTransaccional dentro del clúster para armar los
        correos del registro; no se publica hacia el canal web. Devuelve la versión
        más alta del tipo para el mercado e idioma, con el asunto y los dos cuerpos
        (HTML y texto plano) tal cual se publicaron, **sin rellenar**: las variables
        `{{nombre}}` las sustituye quien consume la plantilla.

        Variables por tipo:
        - `bienvenida`: `nombre`, `urlWeb`, `anio`.
        - `verificacion-correo`: `nombre`, `enlaceVerificacion` (obligatoria), `anio`.
      parameters:
        - name: tipo
          in: path
          required: true
          schema: { $ref: '#/components/schemas/TipoPlantillaCorreo' }
        - $ref: '#/components/parameters/Mercado'
        - $ref: '#/components/parameters/Idioma'
      responses:
        '200':
          description: Versión vigente de la plantilla.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlantillaCorreo' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /entidades-financieras:
    get:
      operationId: listarEntidadesFinancieras
      tags: [Entidades financieras]
      summary: Entidades financieras del mercado
      description: |
        Lista de bancos y entidades del mercado, en el orden en que se presentan. Es la
        lista que ve el cliente cuando no hay datos de su crédito traídos de Open Finance,
        y sirve para reconocer a la entidad acreedora de lo que trae la fuente: `alias` son
        los nombres con los que las fuentes reportan a la entidad (p. ej. `BANCOLOMBIA S.A.`).
        Casi no cambia, así que se puede cachear una hora.
      parameters:
        - $ref: '#/components/parameters/Mercado'
      responses:
        '200':
          description: Entidades del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: ['public, max-age=3600'] }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntidadFinanciera' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }

  /v1/tarifas/vida-hipotecario:
    get:
      operationId: obtenerTarifaVidaHipotecario
      tags: [Tarifas]
      summary: Tarifa del seguro de vida hipotecario y de su cobertura opcional de Hogar
      description: |
        Tasa mensual por cada $1.000 de saldo, por franja de edad (Vida), y la tarifa fija de
        la cobertura opcional de Hogar (`hogar`). Las dos viajan juntas para que Cotización
        arme una cotización con una sola llamada; la guarda en caché y cada cotización registra
        la `version` con que se calculó. Se carga de una semilla al arrancar: cambiarla es
        editar el archivo, subir la `version` y desplegar.
      parameters:
        - $ref: '#/components/parameters/Mercado'
      responses:
        '200':
          description: Tarifa vigente del mercado.
          headers:
            Cache-Control:
              schema: { type: string, examples: ['public, max-age=3600'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TarifaVidaHipotecario' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de identidad de servicio emitido por la malla / gateway interno.
        No se aceptan tokens de cliente final directamente contra esta API.

  parameters:
    Mercado:
      name: mercado
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Mercado' }
    Idioma:
      name: idioma
      in: query
      required: false
      schema:
        type: string
        pattern: '^[a-z]{2}-[A-Z]{2}$'
        default: es-CO
        examples: [es-CO]

  responses:
    SolicitudInvalida:
      description: Parámetros inválidos (mercado, idioma, tipo o versión).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NoEncontrado:
      description: No existe esa versión para ese mercado e idioma.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Mercado:
      type: string
      enum: [CO]

    TipoDocumentoLegal:
      type: string
      enum: [terminos, open-data, open-finance, poliza]
      description: |
        - `terminos` — términos y condiciones y aviso de privacidad.
        - `open-data` — tratamiento de datos personales.
        - `open-finance` — consulta en centrales de riesgo (datos financieros).
        - `poliza` — condiciones de la póliza; se muestran al solicitarla, no en el registro.

    Version:
      type: string
      pattern: '^V[1-9][0-9]*$'
      examples: [V1]

    DocumentoLegal:
      type: object
      additionalProperties: false
      required: [tipo, version, titulo, baseLegal, contenido]
      properties:
        tipo: { $ref: '#/components/schemas/TipoDocumentoLegal' }
        version: { $ref: '#/components/schemas/Version' }
        titulo: { type: string, examples: [Términos y condiciones] }
        subtitulo:
          type: string
          examples: [Las reglas de uso de Solventa. Está corto a propósito.]
        baseLegal: { type: string, examples: [Ley 527 de 1999] }
        contenido:
          type: string
          description: |
            Cuerpo del documento con formato (HTML).
            Etiquetas permitidas: `h3`, `p`, `ul`, `ol`, `li`, `strong`, `em`, `a`, `span`.
            Atributos permitidos: `href` en `a` (solo esquemas `https` y `mailto`) y
            `class` (solo valores con prefijo `legal-`, por ejemplo `legal-highlight`).
            No se permiten `style`, `script`, etiquetas de estilo, imágenes ni manejadores
            de eventos. La web define el significado visual de cada clase `legal-*`.
          examples:
            - '<h3>3 · Para qué la usamos</h3><p>Con buen historial lo que pagas al mes puede bajar hasta <span class="legal-highlight">14 %</span>.</p>'
        notaPie:
          type: string
          description: Texto de pie del documento. Se omite cuando no tiene.

    EntidadFinanciera:
      type: object
      additionalProperties: false
      required: [id, nombre, alias]
      properties:
        id:
          type: string
          description: Identificador estable de la entidad.
          examples: [bancolombia]
        nombre:
          type: string
          description: Nombre que se muestra al cliente.
          examples: [Bancolombia]
        alias:
          type: array
          items: { type: string }
          description: Nombres con los que las fuentes reportan a la entidad.
          examples: [['BANCOLOMBIA S.A.']]

    TipoPlantillaCorreo:
      type: string
      enum: [bienvenida, verificacion-correo]
      description: |
        - `bienvenida` — correo que recibe quien acaba de crear su cuenta.
        - `verificacion-correo` — correo con el enlace para confirmar el correo.

    PlantillaCorreo:
      type: object
      additionalProperties: false
      required: [tipo, version, asunto, cuerpoHtml, cuerpoTexto]
      properties:
        tipo: { $ref: '#/components/schemas/TipoPlantillaCorreo' }
        version: { $ref: '#/components/schemas/Version' }
        asunto:
          type: string
          description: Asunto del correo; puede traer variables.
          examples: ['Te damos la bienvenida a Solventa, {{nombre}}']
        cuerpoHtml:
          type: string
          description: Cuerpo en HTML, sin rellenar. No incluye `script`, `iframe`, `object` ni `embed`.
        cuerpoTexto:
          type: string
          description: Cuerpo en texto plano (alternativa para clientes de correo sin HTML), sin rellenar.

    TarifaVidaHipotecario:
      type: object
      additionalProperties: false
      required: [mercado, producto, version, franjas, hogar]
      properties:
        mercado: { $ref: '#/components/schemas/Mercado' }
        producto: { type: string, const: VIDA_HIPOTECARIO }
        version:
          type: integer
          minimum: 1
          description: Sube cada vez que cambia la tabla de Vida o la tarifa de Hogar.
        hogar:
          type: object
          additionalProperties: false
          required: [tasaMensualPorMil, sumaAseguradaMaxima, iva]
          description: |
            Cobertura opcional de Hogar (incendio y terremoto). La suma asegurada es
            `min(sumaAseguradaMaxima, valor del crédito)`; el `iva` se suma a su prima y no
            aplica a Vida.
          properties:
            tasaMensualPorMil:
              type: number
              exclusiveMinimum: 0
              description: Tasa mensual por cada $1.000 de suma asegurada, sin impuesto.
              examples: [0.099]
            sumaAseguradaMaxima:
              type: number
              exclusiveMinimum: 0
              description: Tope de la suma asegurada, en COP.
              examples: [240000000]
            iva:
              type: number
              minimum: 0
              exclusiveMaximum: 1
              description: Fracción del impuesto sobre el valor agregado (IVA) aplicada a Hogar.
              examples: [0.19]
        franjas:
          type: array
          minItems: 1
          description: Contiguas y en orden de edad.
          items:
            type: object
            additionalProperties: false
            required: [edadDesde, edadHasta, tasaMensualPorMil]
            properties:
              edadDesde: { type: integer, examples: [18] }
              edadHasta: { type: integer, examples: [24] }
              tasaMensualPorMil:
                type: number
                exclusiveMinimum: 0
                description: Tasa mensual por cada $1.000 de saldo.
                examples: [0.062]

    Problema:
      description: Error en formato RFC 9457 (Problem Details for HTTP APIs).
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errores:
          type: array
          description: Detalle por campo cuando aplica (validación).
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
