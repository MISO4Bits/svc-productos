<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirma tu correo</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  BITS-316. Correo de confirmación de la cuenta (BITS-93, AC-5).
  Variable a reemplazar al enviar: {{enlaceVerificacion}}, el enlace a la página web que confirma el correo.
  HTML para correo: tablas y estilos en línea. Gmail ignora las fuentes web: el logo va como imagen
  y el texto cae a Arial donde Plus Jakarta Sans no carga.
  Colores de Figma y tipografía de la escala del Design System (M3), con referencia de layout en pantalla "04 · Confirma tu correo" (2098-1516).
-->
</head>
<body style="margin:0;padding:0;background-color:#F5FAFB;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5FAFB;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
        <tr>
          <td style="padding:0 8px 24px 8px;">
            <img src="https://raw.githubusercontent.com/MISO4Bits/fe-mobile/develop/app/src/main/res/drawable-nodpi/logo_solventa.png" width="128" height="32" alt="Solventa" style="display:block;border:0;font-family:'Dancing Script',cursive;font-size:30px;font-weight:700;color:#006971;">
          </td>
        </tr>
        <tr>
          <td style="background-color:#FFFFFF;border:1px solid #DDE4E5;border-radius:20px;padding:32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:28px;line-height:36px;font-weight:500;color:#161D1D;">
                  Confirma tu correo
                </td>
              </tr>
              <tr>
                <td style="padding-top:12px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;letter-spacing:0.5px;color:#3F484A;">
                  Tu cuenta ya está creada. Confirma tu correo para poder contratar tu seguro. Puedes cotizar desde ya.
                </td>
              </tr>
              <tr>
                <td style="padding-top:24px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="background-color:#006971;border-radius:100px;">
                        <a href="{{enlaceVerificacion}}" style="display:inline-block;padding:18px 28px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;font-weight:500;letter-spacing:0.1px;color:#FFFFFF;text-decoration:none;border-radius:100px;">Confirmar mi correo</a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td style="padding-top:16px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;letter-spacing:0.4px;color:#6F797A;">
                  Si el botón no funciona, copia este enlace en tu navegador:<br>
                  <a href="{{enlaceVerificacion}}" style="color:#006971;word-break:break-all;">{{enlaceVerificacion}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 8px 0 8px;font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;letter-spacing:0.4px;color:#6F797A;">
            Si no creaste una cuenta en Solventa, ignora este correo.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
